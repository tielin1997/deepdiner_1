# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: max_seat_count
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    value: 8
    unit: seats
    added: 2026-04-17
    revised: ""

  - name: initial_seat_count
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    value: 4
    unit: seats
    added: 2026-04-17
    revised: ""

  - name: facility_slots
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    value: 3
    unit: slots
    added: 2026-04-17
    revised: ""

  - name: modifier_floor
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    value: 0
    unit: value
    added: 2026-04-17
    revised: ""

  - name: facility_relic_modifier_min
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    value: 0.1
    unit: multiplier
    notes: "Minimum modifier value for global facilities and relics. Only seat traits can be 0.0."
    added: 2026-04-17
    revised: ""

  - name: max_traits_per_diner
    status: active
    source: design/gdd/diner-system.md
    referenced_by:
      - design/gdd/diner-system.md
    value: 2
    unit: traits
    notes: "Maximum number of traits a single diner can have."
    added: 2026-04-17
    revised: ""

  - name: disguise_multiplier
    status: active
    source: design/gdd/diner-system.md
    referenced_by:
      - design/gdd/diner-system.md
    value: 2.0
    unit: multiplier
    notes: "Disguise emotion path binary random multiplier. 50% ×2.0, 50% ÷2.0."
    added: 2026-04-17
    revised: ""

  - name: adjacent_range
    status: active
    source: design/gdd/diner-system.md
    referenced_by:
      - design/gdd/diner-system.md
    value: 1
    unit: seats
    notes: "Environment aura adjacent seat range (index ±1)."
    added: 2026-04-17
    revised: ""

  - name: max_hand_size
    status: active
    source: design/gdd/card-system.md
    referenced_by:
      - design/gdd/card-system.md
    value: 10
    unit: cards
    notes: "Maximum number of cards in player hand. Hard cap — overflow triggers discard-first-then-get."
    added: 2026-04-17
    revised: ""

  - name: base_plays_per_round
    status: active
    source: design/gdd/card-system.md
    referenced_by:
      - design/gdd/card-system.md
      - design/gdd/turn-flow-system.md
    value: 5
    unit: plays
    notes: "Base number of card plays allowed per round. Modified by restaurant global modifiers."
    added: 2026-04-17
    revised: ""

  - name: run_length
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
    value: 21
    unit: days
    notes: "Total days per run. 7 cycles of 3 days each. MVP fixed, future meta-progression may adjust."
    added: 2026-04-17
    revised: ""

  - name: cycle_length
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
    value: 3
    unit: days
    notes: "Days per cycle. 2 normal days + 1 Boss day per cycle."
    added: 2026-04-17
    revised: ""

