# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-04-17"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: effective_base_fee
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
      - design/gdd/diner-system.md
    variables:
      - DinerBaseFee
      - CookingLevelMultiplier
      - SeatBaseFeeMod
      - FacilityBaseFeeMod
      - RelicBaseFeeMod
    output_range: [0, 9999]
    expression: "floor(DinerBaseFee * CookingLevelMultiplier * SeatBaseFeeMod * FacilityBaseFeeMod * RelicBaseFeeMod)"
    notes: "Multiplier chain: base -> seat -> facility -> relic. Floor to int, min 0."
    added: 2026-04-17
    revised: ""

  - name: effective_add_on_fee
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
      - design/gdd/diner-system.md
      - design/gdd/card-system.md
    variables:
      - CardFaceValue
      - SeatAddOnMod
      - FacilityAddOnMod
      - RelicAddOnMod
    output_range: [0, 9999]
    expression: "floor(CardFaceValue * SeatAddOnMod * FacilityAddOnMod * RelicAddOnMod)"
    notes: "Multiplier chain for add-on dish cost. Card system owns CardFaceValue."
    added: 2026-04-17
    revised: ""

  - name: effective_diner_gold
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
      - design/gdd/diner-system.md
    variables:
      - DinerBaseGold
      - SeatGoldMod
      - FacilityGoldMod
      - RelicGoldMod
    output_range: [0, 9999]
    expression: "floor(DinerBaseGold * SeatGoldMod * FacilityGoldMod * RelicGoldMod)"
    notes: "Diner system owns DinerBaseGold. Multiplier chain for effective gold."
    added: 2026-04-17
    revised: ""

  - name: devour_chance
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    variables:
      - SeatDevourChance
      - FacilityDevourChance
      - RelicDevourChance
    output_range: [0.0, 1.0]
    expression: "clamp(SeatDevourChance + FacilityDevourChance + RelicDevourChance, 0.0, 1.0)"
    notes: "Additive stacking for probabilities. Clamp to 1.0 max."
    added: 2026-04-17
    revised: ""

  - name: dine_and_dash_chance
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    variables:
      - SeatDineAndDashChance
      - FacilityDineAndDashChance
      - RelicDineAndDashChance
    output_range: [0.0, 1.0]
    expression: "clamp(SeatDineAndDashChance + FacilityDineAndDashChance + RelicDineAndDashChance, 0.0, 1.0)"
    notes: "Additive stacking. Priority: dine-and-dash > devour when both trigger."
    added: 2026-04-17
    revised: ""

  - name: daily_target
    status: active
    source: design/gdd/restaurant-system.md
    referenced_by:
      - design/gdd/restaurant-system.md
    variables:
      - BaseTarget
      - TargetGrowth
      - DayNumber
    output_range: [1, 9999]
    expression: "BaseTarget + TargetGrowth * (DayNumber - 1)"
    notes: "Daily revenue target. Configured via TbRestaurantProgress in Luban."
    added: 2026-04-17
    revised: ""

  - name: diner_base_gold_generation
    status: active
    source: design/gdd/diner-system.md
    referenced_by:
      - design/gdd/diner-system.md
    variables:
      - RawGold
      - GoldMultiplier
      - DisguiseMultiplier
    output_range: [0, 9999]
    expression: "Config-driven: RawGold from range, then ×GoldMultiplier (disguise: 50% ×2 / 50% ÷2)"
    notes: "All values from TbDinerTemplate + TbEmotionPath. Disguise path uses binary random."
    added: 2026-04-17
    revised: ""

  - name: gold_spent_ratio
    status: active
    source: design/gdd/diner-system.md
    referenced_by:
      - design/gdd/diner-system.md
    variables:
      - CumulativeSpent
      - EffectiveDinerGold
    output_range: [0.0, 9999.0]
    expression: "CumulativeSpent / EffectiveDinerGold"
    notes: "Drives emotion path lookup via TbEmotionPath thresholds."
    added: 2026-04-17
    revised: ""

  - name: round_revenue
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
    variables:
      - SettlementAmount
    output_range: [0, 9999]
    expression: "Sum of SettlementAmount_i for all settled diners. PAY=TotalCost, DEVOUR=EffectiveDinerGold+bonus, DineAndDash=0"
    notes: "Turn flow aggregation formula. Settlement amounts sourced from restaurant/diner systems."
    added: 2026-04-17
    revised: ""

  - name: daily_revenue
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
    variables:
      - RoundRevenue
    output_range: [0, 9999]
    expression: "Sum of RoundRevenue_j for j=1..CompletedRounds"
    notes: "Accumulated daily revenue. Compared against DailyTarget for early end / game over."
    added: 2026-04-17
    revised: ""

  - name: day_result_verdict
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
    variables:
      - DailyRevenue
      - DailyTarget
      - RoundNumber
      - MaxRounds
    output_range: [0, 2]
    expression: "if DailyRevenue>=DailyTarget -> TARGET_MET(2); else if roundNumber<MaxRounds -> CONTINUE(1); else -> GAME_OVER(0)"
    notes: "Conditional verdict after each round settlement. Drives day-level flow control."
    added: 2026-04-17
    revised: ""

  - name: early_bonus_tickets
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
      - design/gdd/economy-system.md
    variables:
      - UnusedRounds
      - TicketPerUnusedRound
    output_range: [0, 9999]
    expression: "UnusedRounds * TicketPerUnusedRound"
    notes: "Bonus tickets when daily target met before all rounds used. Config via TbShopConfig."
    added: 2026-04-17
    revised: ""

  - name: shop_display_count
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
      - design/gdd/economy-system.md
    variables:
      - BaseShopDisplay
      - ShopDisplayBonuses
      - TotalPoolSize
    output_range: [1, 999]
    expression: "min(BaseShopDisplay + Sum(ShopDisplayBonuses), TotalPoolSize)"
    notes: "Number of items shown in shop. Clamped to pool size."
    added: 2026-04-17
    revised: ""

  - name: cycle_index
    status: active
    source: design/gdd/turn-flow-system.md
    referenced_by:
      - design/gdd/turn-flow-system.md
    variables:
      - DayNumber
      - CycleLength
    output_range: [1, 7]
    expression: "ceil(DayNumber / CycleLength)"
    notes: "Determines which 3-day cycle the current day belongs to. Used for Boss template lookup."
    added: 2026-04-17
    revised: ""

  - name: day_ticket_award
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
    variables:
      - BaseDayTickets
      - DailyRevenue
      - RevenueToTicketRatio
      - EarlyBonusTickets
      - BossKillBonus
    output_range: [0, 9999]
    expression: "BaseDayTickets + floor(DailyRevenue × RevenueToTicketRatio) + EarlyBonusTickets + BossKillBonus"
    notes: "Daily ticket award. Revenue converted from gold to tickets at ratio. Boss bonus per devoured Boss."
    added: 2026-04-17
    revised: ""

  - name: interest
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
    variables:
      - TicketBalance
      - InterestCap
      - InterestRate
    output_range: [0, 9999]
    expression: "floor(min(TicketBalance, InterestCap) × InterestRate)"
    notes: "Interest calculated after FE1 award, before shop opens. Cap prevents runaway accumulation."
    added: 2026-04-17
    revised: ""

  - name: shop_final_price
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
    variables:
      - BasePrice
      - ShopDiscountMod
    output_range: [1, 9999]
    expression: "max(1, floor(BasePrice × ShopDiscountMod))"
    notes: "Final shop price after discount modifier. Floor 1 prevents free purchases."
    added: 2026-04-17
    revised: ""

  - name: category_refresh_cost
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
    variables:
      - BaseRefreshCost
      - PreviousRefreshes
      - RefreshCostIncrement
    output_range: [1, 9999]
    expression: "BaseRefreshCost + PreviousRefreshes × RefreshCostIncrement"
    notes: "Per-category refresh cost. PreviousRefreshes resets daily per category. Escalating cost is natural limiter."
    added: 2026-04-17
    revised: ""

